# ---------------------------------------------------------------------------
# MkDocs configuration for the Lab Guide site
# Docs: https://www.mkdocs.org/user-guide/configuration/
#       https://squidfunk.github.io/mkdocs-material/
# ---------------------------------------------------------------------------

site_name: Cloud Solutions Lab Guides
site_description: Hands-on, step-by-step labs for configuring and using cloud collaboration solutions.
site_author: Lab Content Team

# Change these two to match your GitHub repo before the first deploy.
site_url: https://canewton-ccep.github.io/Not-Real-Lab-Guide-Test/
repo_url: https://github.com/canewton-ccep/Not-Real-Lab-Guide-Test
repo_name: canewton-ccep/Not-Real-Lab-Guide-Test
edit_uri: edit/main/docs/

copyright: Copyright &copy; Cisco Systems, Inc. For training use only.

theme:
  name: material
  language: en
  features:
    - navigation.tabs          # top-level sections become tabs
    - navigation.sections
    - navigation.top
    - navigation.footer        # prev/next links at page bottom
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy        # copy button on code blocks
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox          # click-to-zoom on screenshots
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition          # !!! note / warning / tip callouts
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details    # collapsible ??? blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys       # ++ctrl+c++ renders as keyboard keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Labs:
      - Overview: labs/index.md
      - "Webex: Onboard a Messaging User":
          - Lab Overview: labs/webex-messaging-onboarding/index.md
          - "Task 1 – Prerequisites & Sign In": labs/webex-messaging-onboarding/01-prerequisites.md
          - "Task 2 – Add the User": labs/webex-messaging-onboarding/02-add-user.md
          - "Task 3 – Assign the Messaging License": labs/webex-messaging-onboarding/03-assign-license.md
          - "Task 4 – Verify in Control Hub": labs/webex-messaging-onboarding/04-verify-user.md
          - "Task 5 – Activate & Sign In to Webex App": labs/webex-messaging-onboarding/05-activate-signin.md
          - "Task 6 – Send Messages": labs/webex-messaging-onboarding/06-exchange-messages.md
          - "Task 7 – Clean Up": labs/webex-messaging-onboarding/07-cleanup.md
          - Troubleshooting: labs/webex-messaging-onboarding/troubleshooting.md
          - Instructor Notes: labs/webex-messaging-onboarding/instructor-notes.md
  - Authoring:
      - Writing a New Lab: authoring/writing-a-lab.md
      - Lab Template: authoring/lab-template.md
      - Style Guide: authoring/style-guide.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/canewton-ccep/Not-Real-Lab-Guide-Test
